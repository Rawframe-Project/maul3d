# Continuous integration: the pull request check, and the full check on
# main and every night. Each build cell is a CMake preset built by the
# organization's shared workflow, and every cell checks the golden scenes
# against test/hashes.txt, so the cells agree bit for bit and no result
# moves unnoticed. The bench job does the same for the benchmark scenes on
# main and every night. The other jobs run in the same CI image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL3D

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the module, length and
  # snippet checks, test hygiene and labels, the bindings against the C
  # API, the documentation site, and clang-tidy. It runs on documentation
  # changes too, since the snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # An empty list would make xargs run clang-format on stdin and
          # pass with nothing checked.
          files=$(git ls-files 'include/*.h' 'src/*.[ch]' 'test/*.[ch]' 'tools/*.[ch]' 'bench/*.[ch]' \
            'samples/*.[ch]' 'testbed/*.[ch]')
          [ -n "$files" ] || { echo "::error::no C sources found"; exit 1; }
          echo "$files" | xargs clang-format --dry-run -Werror
      - name: Family checks
        # check_docs arrives with the documentation rewrite.
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/check_float_env.py
      # Every test registration, in the configurations that add tests: the
      # Release build's bench scenes, and the shared build's exports and
      # package tests.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake -B out/hygiene -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake -B out/hygiene-shared -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_BUILD_TYPE=Release \
            -D${PREFIX}_BUILD_SHARED=ON -D${PREFIX}_TEST_PACKAGE=ON >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/hygiene --ctest out/hygiene-shared
      - name: The bindings match the C API
        run: python3 tools/check_bindings.py clang-20
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # On the Release build, where the assertions compile out, and on
        # the Debug build, where they are live: each hides findings the
        # other shows. Cognitive complexity is checked once the functions
        # above its limit are split or listed.
        run: |
          for build in Release Debug; do
            cmake --preset linux-clang-20 -B "out/tidy-$build" -DCMAKE_BUILD_TYPE=$build \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -D${PREFIX}_BUILD_TESTS=OFF \
              -D${PREFIX}_BUILD_SAMPLES=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_TOOLS=OFF
            for f in src/*.c; do
              clang-tidy-20 -p "out/tidy-$build" --quiet --warnings-as-errors='*' \
                --checks=-readability-function-cognitive-complexity "$f"
            done
          done

  # Every cell builds with warnings as errors and runs the whole suite, the
  # header tests and the golden scenes included. linux-gcc-14 also runs on
  # arm64, where the NEON kernels must give the same bits as AVX2 and the
  # scalar backend of the sanitizer cell.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-i686-gcc-14 }
          - { preset: linux-i686-clang-20 }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
          - { preset: windows-arm64-clang-cl, runner: windows-11-arm }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}
      timeout: ${{ matrix.timeout || 20 }}

  # The benchmark scenes, pinned like the golden scenes: five and ten
  # thousand bodies, destruction at scale and a 5k-body rollback, in Release
  # on every native platform. Each cell adds a Release build and about
  # twenty seconds of scenes, so they run on main and every night, never in
  # the pull request check.
  bench:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14-bench }
          - { preset: linux-gcc-14-bench, runner: ubuntu-24.04-arm }
          - { preset: linux-clang-20-bench }
          - { preset: macos-clang-bench, runner: macos-15 }
          - { preset: windows-clang-cl-bench, runner: windows-2025 }
          - { preset: windows-arm64-clang-cl-bench, runner: windows-11-arm }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      timeout: 60

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The library and its tests under Emscripten with threads, run by Node: the
  # golden scenes hold there too. The CI image has no Emscripten, so this
  # job uses the runner and the emsdk action.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # Pinned like every toolchain: an update announces itself through
          # a red build, not a silent drift of the bits.
          version: 6.0.2
      - name: Build
        run: |
          cmake --preset wasm-node
          cmake --build --preset wasm-node -j 4
      - name: Test
        run: |
          ctest --preset wasm-node --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-wasm-node
          path: out/wasm-node/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # Each fuzz target reads the bytes a program gets from disk or a peer (a
  # snapshot, a journal tape, a replay file), seeded by fuzz_seeds from the
  # shared scene and by the corpus fuzz-nightly grew, restored read-only:
  # briefly on a pull request, so a change that breaks a harness's promise
  # fails on its own pull request, longer on main. Only fuzz-nightly saves
  # the corpus.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || 90 }}
      # The targets with a restore step below; Run fails on a built target
      # missing here, so a new target cannot fuzz from the seeds alone.
      CORPUS_TARGETS: fuzz_journal fuzz_replay fuzz_restore_step fuzz_snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-
      - name: Build
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats >/dev/null
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -D${PREFIX}_FUZZ=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_SAMPLES=OFF \
            -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_TOOLS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
          ccache --show-stats
          out/fuzz/fuzz_seeds out/seeds
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-fuzz-${{ github.sha }}
      # Each target's latest corpus, read-only, one step per name in
      # CORPUS_TARGETS. The key never matches, so the newest corpus of any
      # build is taken; a target with none yet starts from the seeds.
      - name: Restore the journal corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_journal
          key: corpus-fuzz_journal-read-${{ github.run_id }}
          restore-keys: corpus-fuzz_journal-
      - name: Restore the replay corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_replay
          key: corpus-fuzz_replay-read-${{ github.run_id }}
          restore-keys: corpus-fuzz_replay-
      - name: Restore the restore-step corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_restore_step
          key: corpus-fuzz_restore_step-read-${{ github.run_id }}
          restore-keys: corpus-fuzz_restore_step-
      - name: Restore the snapshot corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_snapshot
          key: corpus-fuzz_snapshot-read-${{ github.run_id }}
          restore-keys: corpus-fuzz_snapshot-
      - name: Run
        # As many targets at a time as the runner has cores; each keeps its
        # full time. tools/fuzz_target.sh keeps a target's findings and log
        # on the runner and reports a finding without its input; the
        # reports print once every target has finished.
        run: |
          targets=$(find out/fuzz -maxdepth 1 -name 'fuzz_*' -type f -perm -u+x ! -name fuzz_seeds)
          [ -n "$targets" ] || { echo "::error::no fuzz target was built"; exit 1; }
          for target in $targets; do
            name=$(basename "$target")
            case " $CORPUS_TARGETS " in
            *" $name "*) ;;
            *)
              echo "::error::$name has no corpus restore step in the fuzz job"
              exit 1
              ;;
            esac
            mkdir -p "out/corpus/$name"
          done
          rm -rf out/fuzz-reports
          status=0
          echo "$targets" |
            xargs -P "$(nproc)" -I {} sh -c 'name=$(basename "$1"); tools/fuzz_target.sh "$1" \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 "out/corpus/$name" "out/seeds/$name"' _ {} ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"

  # The fuzz targets, one per test/fuzz_*.c but the seed writer, for
  # fuzz-nightly's matrix.
  fuzz-targets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(cd test && ls fuzz_*.c | grep -v '^fuzz_seeds\.c$' | sed 's/\.c$//' | jq -R . | jq -cs .)
          [ "$targets" != "[]" ] || { echo "::error::no fuzz target found"; exit 1; }
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

  # Every night each target fuzzes ten minutes from its corpus of the nights
  # before, carried in an Actions cache, in a job of its own so that every
  # target runs at once. The cache is keyed by the target and the run id, and
  # each night restores the target's newest corpus, whatever build saved it:
  # a corpus is only inputs, which stay valid against a new binary.
  # prune-caches keeps that newest one and deletes the rest. After the run
  # the fuzzer's merge minimizes the seeds and the corpus together against
  # this binary, and on main the result is saved for the next night. The
  # summary compares the seeds' coverage with the corpus's.
  fuzz-nightly:
    needs: fuzz-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_SAMPLES=OFF -D${PREFIX}_BUILD_BENCH=OFF \
            -D${PREFIX}_BUILD_TOOLS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz --target "$TARGET" fuzz_seeds
          [ -x "out/fuzz/$TARGET" ] || { echo "::error::$TARGET was not built"; exit 1; }
          out/fuzz/fuzz_seeds out/seeds
      - name: Restore the corpus
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          # The key never matches, so the target's newest corpus is taken. A
          # corpus is only inputs: they stay valid across source and compiler
          # changes, and the merge re-scores them. One key per target lets
          # prune-caches delete every corpus but the newest.
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-
      - name: Fuzz
        # tools/fuzz_target.sh keeps the findings and the log on the runner
        # and reports a finding without its input.
        run: |
          mkdir -p "out/corpus/$TARGET"
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh "out/fuzz/$TARGET" -max_total_time=600 -timeout=10 \
            "out/corpus/$TARGET" "out/seeds/$TARGET" || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      - name: Minimize the corpus
        env:
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          # Minimized together: the files of the seeds and the corpus that
          # keep every feature either reaches, seeds among them. The merge
          # reruns every input; tools/fuzz_target.sh keeps its log on the
          # runner and fails, reporting without the input, when it met a
          # finding, so a corpus near one is not saved. Its report prints
          # here, as the Fuzz step prints the run's.
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh --merge "out/fuzz/$TARGET" out/merged "out/seeds/$TARGET" \
            "out/corpus/$TARGET" || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          rm -rf "out/corpus/$TARGET"
          mv out/merged "out/corpus/$TARGET"
          coverage() { "out/fuzz/$TARGET" -runs=0 "$@" 2>&1 | sed -n 's/.*INITED cov: \([0-9]*\).*/\1/p'; }
          restored=${MATCHED:-none: the seeds alone}
          {
            echo "| Target | Corpus restored | Seeds' coverage | Corpus's coverage | Corpus files |"
            echo "|---|---|---|---|---|"
            echo "| \`$TARGET\` | $restored | $(coverage "out/seeds/$TARGET") | $(coverage "out/corpus/$TARGET") | $(ls "out/corpus/$TARGET" | wc -l) |"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Save the corpus
        # Only main saves, so every corpus is in main's scope, where each
        # run restores it and prune-caches deletes the replaced ones.
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}

  # The interactive testbed builds against raylib, which it fetches; only on
  # main and at night, since the library cells already compile every source
  # it calls.
  testbed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/testbed -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 \
            -D${PREFIX}_WERROR=ON -D${PREFIX}_BUILD_TESTBED=ON -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build out/testbed --target testbed

  # Main's last job: deletes the cache entries of main a newer save
  # replaced, the per-commit ccache and codeql entries and the per-run
  # corpora, so the 10 GB keeps one entry per cache and GitHub never evicts
  # the corpus fuzz-nightly saved. Skipped on a pull request.
  prune-caches:
    needs: [build, bench, fuzz, fuzz-nightly]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: Rawframe-Project/.github/.github/workflows/cache-prune.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      actions: write

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, bench, msvc-headers, web, fuzz, fuzz-targets, fuzz-nightly, testbed, prune-caches]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
