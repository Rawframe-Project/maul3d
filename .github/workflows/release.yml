name: release

# release-please keeps a draft release pull request open from the
# conventional commits on main. Merging it tags vX.Y.Z and creates the GitHub
# release; the binaries job builds the installed library for each platform,
# and the assets job adds the source archive, writes the checksums and an
# SBOM, attests where everything was built, and attaches it all to the
# release. docs/operations/release.md has the steps.

on:
  push:
    branches: [main]
  # Runs again by hand after a failed push run, without a new commit.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Both steps act with the app token, so github.token needs no permissions here.
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The Rawframe Release app's token, not github.token, so the release pull
      # request runs CI: GitHub starts no workflows for pull requests github.token opens.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses: the release commit and tag, the
          # release pull request, and its labels.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The installed tree (static library, headers, CMake package, pkg-config
  # file, m3replay and m3lockstep) for each platform, as a workflow artifact
  # the assets job collects.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-24.04, preset: linux-gcc-14 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, preset: linux-gcc-14 }
          - { name: macos-arm64, runner: macos-15, preset: macos-clang }
          - { name: windows-x64, runner: windows-2025, preset: windows-clang-cl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ startsWith(matrix.runner, 'ubuntu') && 'ghcr.io/rawframe-project/ci-cpp:2026.10.4@sha256:9715ff153db04ba0ed4f520b6d2528ff7860f803de61ab011ba60a4eed572836' || null }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Build and install
        env:
          PRESET: ${{ matrix.preset }}
          NAME: ${{ matrix.name }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cmake --preset "$PRESET" -DMAUL3D_BUILD_TESTS=OFF -DMAUL3D_BUILD_SAMPLES=OFF -DMAUL3D_BUILD_BENCH=OFF
          cmake --build --preset "$PRESET"
          dir="maul3d-${TAG#v}-$NAME"
          cmake --install "out/$PRESET" --config Release --prefix "stage/$dir"
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            (cd stage && 7z a "../dist/$dir.zip" "$dir" >/dev/null)
          else
            tar -C stage -czf "dist/$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  assets:
    needs: [release-please, binaries]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: The source archive
        # GitHub's own source archives are not promised byte-stable; this one
        # is checksummed and attested.
        run: |
          git archive --format=tar.gz --prefix="${GITHUB_REPOSITORY#*/}-${TAG#v}/" -o "dist/${GITHUB_REPOSITORY#*/}-${TAG#v}.tar.gz" HEAD
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
