# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@e6b9db735576653736d19d9c50d47e1b428af77a # v0.0.22
    permissions:
      pull-requests: read
    with:
      scopes: world body shape collision solver joint vehicle character softbody voxel water query event snapshot journal replay simd draw bindings tools testbed samples bench build family
